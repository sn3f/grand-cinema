# À chaque push, lance les tests puis envoie le code et la couverture à SonarQube Cloud
name: SonarQube

on:
  push:
  pull_request:

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=n3f-Dsonar.projectKey=sn3f_grand-cinema
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
